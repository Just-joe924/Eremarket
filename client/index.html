<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <title>Cara — Buy &amp; Sell Near You</title>
    <meta
      name="description"
      content="Cara is a marketplace where local sellers open a storefront and buyers shop across every store. Pay online by card, transfer or USSD — or reserve and pay when you collect."
    />

    <!-- Link preview card, mostly for WhatsApp. og:image must be an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cara" />
    <meta property="og:title" content="Cara — Buy &amp; Sell Near You" />
    <meta
      property="og:description"
      content="Shop local storefronts in naira. Pay online, or reserve and pay when you collect."
    />
    <meta property="og:url" content="https://www.caraecom.store/" />
    <meta property="og:image" content="https://www.caraecom.store/img/logo.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Surface startup crashes (e.g. missing env vars) instead of a blank page. -->
    <script>
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root')
        if (root && !root.hasChildNodes()) {
          root.innerHTML =
            '<div style="font-family:sans-serif;max-width:640px;margin:80px auto;padding:24px;text-align:center;color:#222">' +
            '<h1 style="color:#088178;margin:0 0 12px">App failed to start</h1>' +
            '<p style="margin:0 0 12px">' +
            ((e && e.message) || 'A startup error occurred.') +
            '</p>' +
            '<p style="color:#666;font-size:14px;margin:0">Open the browser console for details. If this mentions Supabase env, set ' +
            '<code>VITE_SUPABASE_URL</code> and <code>VITE_SUPABASE_ANON_KEY</code> in your host and redeploy.</p>' +
            '</div>'
        }
      })
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
